===================================================== */

function renderBibleDays() {

  const box =
    document.getElementById("bibleDays");

  box.innerHTML = "";

  bible.forEach(item => {

    const button =
      document.createElement("button");

    if (bibleDone.includes(item.day)) {
      button.textContent = "✓ " + item.day;
      button.classList.add("done");
    } else {
      button.textContent = item.day;
    }

    if (bibleCurrent === item.day) {
      button.classList.add("active");
    }

    button.onclick = function() {

      bibleCurrent = item.day;

      renderBibleDays();
      renderBible();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    box.appendChild(button);

  });

  updateProgress();
}


/* =====================================================
   성경 내용
===================================================== */

function renderBible() {

  const d =
    bible.find(x => x.day === bibleCurrent);

  if (!d) return;

  const questions =
    d.questions.map((q,i) => {

      return `
        <div class="question">
          <strong>${i+1}.</strong> ${q}
        </div>
      `;

    }).join("");

  document.getElementById("bibleContent").innerHTML = `

    <div class="badge">
      📅 ${d.day}일차
    </div>

    <div class="dayTitle">
      ${d.title}
    </div>

    <div class="range">
      📖 ${d.range}
    </div>

    <h3>📝 오늘의 성경 내용</h3>

    <div class="summary">

      ${d.summary}

    </div>


    <h3>📖 성경 본문 읽기</h3>

    <div class="info">

      <strong>
        ${d.range}
      </strong>

      <p>
        아래 버튼을 누르면
        <strong>JW.org의 신세계역 연구용 성경</strong>
        에서 해당 부분을 읽을 수 있습니다.
      </p>

      <button class="button jw"
        onclick="openJW(${d.id},${d.chapter})">

        📖 JW.org에서 성경 본문 열기

      </button>

      <button class="button voice"
        onclick="speakKorean(\`${d.summary}\`)">

        🔊 오늘의 내용 음성으로 듣기

      </button>

    </div>


    <h3>💭 묵상: 생각해 볼 질문</h3>

    ${questions}


    <h3>⭐ 오늘의 실천</h3>

    <div class="practice">

      오늘 읽은 성경 내용 가운데
      한 가지를 골라 실제 생활에서 실천해 보세요.

    </div>


    <button class="button complete"
      onclick="toggleBible(${d.day})">

      ${
        bibleDone.includes(d.day)
        ? "✅ 완료됨 — 다시 누르면 완료 취소"
        : "☑️ ${d.day}일차 읽기 완료"
      }

    </button>

  `;
}


/* =====================================================
   JW.org 성경 장 열기

   JW.org의 워치타워 온라인 라이브러리에서
   신세계역 연구용 성경의 해당 책/장을 엽니다.
===================================================== */

function openJW(bookId, chapter) {

  const url =
    "https://wol.jw.org/ko/wol/b/r8/lp-ko/nwtsty/"
    + bookId + "/" + chapter;

  window.open(url, "_blank");

}


/* =====================================================
   성경 완료
===================================================== */

function toggleBible(day) {

  if (bibleDone.includes(day)) {

    bibleDone =
      bibleDone.filter(x => x !== day);

  } else {

    bibleDone.push(day);

  }

  localStorage.setItem(
    "bibleDone",
    JSON.stringify(bibleDone)
  );

  renderBibleDays();
  renderBible();
}


/* =====================================================
   영어 명시 날짜
===================================================== */

function renderPoemDays() {

  const box =
    document.getElementById("poemDays");

  box.innerHTML = "";

  for (let day=1; day<=100; day++) {

    const button =
      document.createElement("button");

    if (poemDone.includes(day)) {

      button.textContent = "✓ " + day;
      button.classList.add("done");

    } else {

      button.textContent = day;

    }

    if (poemCurrent === day) {

      button.classList.add("active");

    }

    button.onclick = function() {

      poemCurrent = day;

      renderPoemDays();
      renderPoem();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };

    box.appendChild(button);
  }

  updateProgress();
}


/* =====================================================
   영어 명시 내용
===================================================== */

function renderPoem() {

  const poemNumber =
    Math.ceil(poemCurrent / 2);

  const p =
    poems[poemNumber - 1];

  if (!p) return;

  const firstDay =
    poemNumber * 2 - 1;

  const secondDay =
    poemNumber * 2;

  const firstStudy =
    poemCurrent === firstDay;

  document.getElementById("poemContent").innerHTML = `

    <div class="badge">
      🇬🇧 명시 ${poemNumber} / 50
    </div>

    <div class="poemTitle">
      ${p[1]}
    </div>

    <div class="author">
      ${p[0]}
    </div>

    <p>
      ${p[2]}
    </p>


    <div class="info">

      📅 ${firstDay}–${secondDay}일차

      <br>

      ${
        firstStudy
        ? "1일차 · 작품 이해"
        : "2일차 · 표현과 묵상"
      }

    </div>


    <h3>🇬🇧 오늘의 영어 표현</h3>

    <div class="english">

      <strong>${p[3]}</strong>

    </div>


    <button class="button voice"
      onclick="speakEnglish(\`${p[3]}\`)">

      🔊 영어로 읽어 듣기

    </button>


    <h3>📝 한국어 공부</h3>

    <div class="summary">

      이 작품은
      <strong>${p[1]}</strong>을 통해
      ${p[2]}

      <br><br>

      먼저 영어 문장을 소리 내어 읽고,
      문장의 의미를 자신의 말로 설명해 보세요.

    </div>


    <h3>📚 핵심 공부</h3>

    <div class="info">

      • 모르는 단어를 찾아봅니다.<br>
      • 영어 문장을 소리 내어 읽습니다.<br>
      • 문장의 분위기를 생각합니다.<br>
      • 자신의 말로 내용을 설명합니다.

    </div>


    <h3>💭 생각해 볼 질문</h3>

    <div class="question">
      1. ${p[4]}
    </div>

    <div class="question">
      2. ${p[5]}
    </div>

    <div class="question">
      3. 이 작품에서 오늘 기억하고 싶은 것은 무엇입니까?
    </div>


    <h3>⭐ 오늘의 연습</h3>

    <div class="practice">

      영어 문장을 3번 소리 내어 읽어 보세요.
      <br>
      그다음 한국어로 뜻을 설명해 보세요.

    </div>


    <button class="button complete"
      onclick="togglePoem(${poemCurrent})">

      ${
        poemDone.includes(poemCurrent)
        ? "✅ ${poemCurrent}일차 완료 — 취소"
        : "☑️ ${poemCurrent}일차 공부 완료"
      }

    </button>

  `;
}


/* =====================================================
   영어 명시 완료
===================================================== */

function togglePoem(day) {

  if (poemDone.includes(day)) {

    poemDone =
      poemDone.filter(x => x !== day);

  } else {

    poemDone.push(day);

  }

  localStorage.setItem(
    "poemDone",
    JSON.stringify(poemDone)
  );

  renderPoemDays();
  renderPoem();
}


/* =====================================================
   진행률
===================================================== */

function updateProgress() {

  const poemVisible =
    !document
      .getElementById("poemSection")
      .classList.contains("hidden");

  let done;
  let total;

  if (poemVisible) {

    done = poemDone.length;
    total = 100;

  } else {

    done = bibleDone.length;
    total = 30;

  }

  const percent =
    Math.round((done / total) * 100);

  document.getElementById("progressText")
    .textContent =
    `${done} / ${total}일 완료 (${percent}%)`;

  document.getElementById("progressBar")
    .style.width =
    percent + "%";
}


/* =====================================================
   한국어 음성
===================================================== */

function speakKorean(text) {

  if (!("speechSynthesis" in window)) {

    alert(
      "이 휴대폰의 브라우저에서는 음성 기능을 사용할 수 없습니다."
    );

    return;
  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "ko-KR";
  speech.rate = 0.9;

  speechSynthesis.speak(speech);
}


/* =====================================================
   영어 음성
===================================================== */

function speakEnglish(text) {

  if (!("speechSynthesis" in window)) {

    alert(
      "이 휴대폰의 브라우저에서는 음성 기능을 사용할 수 없습니다."
    );

    return;
  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";
  speech.rate = 0.78;

  speechSynthesis.speak(speech);
}


/* =====================================================
   시작
===================================================== */

showBible();

</script>
