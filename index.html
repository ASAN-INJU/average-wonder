let currentDay = 1;
let completed = JSON.parse(localStorage.getItem("bible30") || "[]");

function renderButtons() {
  const box = document.getElementById("dayButtons");
  box.innerHTML = "";

  days.forEach(d => {
    const btn = document.createElement("button");
    btn.className = "day-button";

    if (d.day === currentDay) {
      btn.classList.add("active");
    }

    if (completed.includes(d.day)) {
      btn.classList.add("done");
      btn.textContent = "✓ " + d.day;
    } else {
      btn.textContent = d.day + "일";
    }

    btn.onclick = () => {
      currentDay = d.day;
      renderButtons();
      renderDay();
      window.scrollTo({top: 0, behavior: "smooth"});
    };

    box.appendChild(btn);
  });

  updateProgress();
}

function renderDay() {
  const d = days.find(x => x.day === currentDay);

  const questions = d.questions.map((q, i) =>
    `<div class="question"><strong>${i + 1}.</strong> ${q}</div>`
  ).join("");

  const isDone = completed.includes(d.day);

  document.getElementById("content").innerHTML = `
    <div class="day-title">📅 ${d.day}일차</div>

    <div class="range">${d.range}</div>

    <a class="action read"
       href="${d.url}"
       target="_blank"
       rel="noopener">
       📖 jw.org에서 성경 읽기
    </a>

    <a class="action audio"
       href="${d.url}"
       target="_blank"
       rel="noopener">
       🔊 jw.org에서 음성으로 듣기
    </a>

    <div class="section-title">📝 오늘의 내용</div>
    <p>${d.summary}</p>

    <div class="section-title">💭 묵상해 볼 질문</div>
    ${questions}

    <div class="section-title">⭐ 오늘의 실천</div>
    <div class="practice">${d.practice}</div>

    <button class="complete" onclick="toggleComplete(${d.day})">
      ${isDone ? "✅ 읽기 완료 취소" : "☑️ 오늘 읽기 완료"}
    </button>

    <p class="small">
      ${isDone
        ? "이 날짜는 완료로 표시되어 있습니다."
        : "성경을 읽고 음성을 들은 뒤 완료 버튼을 눌러 주세요."}
    </p>
  `;
}

function toggleComplete(day) {
  if (completed.includes(day)) {
    completed = completed.filter(x => x !== day);
  } else {
    completed.push(day);
  }

  localStorage.setItem("bible30", JSON.stringify(completed));
  renderButtons();
  renderDay();
}

function updateProgress() {
  const count = completed.length;
  const percent = Math.round((count / 30) * 100);

  document.getElementById("progressText").textContent =
    `${count} / 30일 완료`;

  document.getElementById("progressBar").style.width =
    percent + "%";
}

function resetProgress() {
  if (confirm("30일 진행 기록을 모두 지울까요?")) {
    completed = [];
    localStorage.removeItem("bible30");
    renderButtons();
    renderDay();
  }
}

renderButtons();
renderDay();

</script>
