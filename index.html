<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>나의 성경 & 영어 명시 공부</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f6fa;
  color: #222;
  font-family:

    BlinkMacSystemFont,
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
  line-height: 1.7;
}

header {
  background: linear-gradient(135deg,#315d9b,#557fc0);
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 6px 0 0;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 15px;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 15px 0;
}

.menu button {
  border: 0;
  background: white;
  border-radius: 16px;
  padding: 22px 10px;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.menu button.active {
  background: #315d9b;
  color: white;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.progress {
  height: 12px;
  background: #e3e7ed;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 8px;
}

.progressBar {
  height: 100%;
  width: 0;
  background: #315d9b;
  transition: .3s;
}

.days {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 7px;
  margin: 15px 0;
}

.days button {
  border: 0;
  border-radius: 10px;
  background: white;
  padding: 11px 3px;
  font-weight: bold;
  color: #315d9b;
}

.days button.active {
  background: #315d9b;
  color: white;
}

.days button.done {
  background: #dff2e5;
  color: #177238;
}

h2 {
  color: #315d9b;
  margin-top: 0;
}

h3 {
  margin-bottom: 6px;
}

.author {
  color: #666;
  font-size: 16px;
}

.poemTitle {
  font-size: 24px;
  font-weight: bold;
}

.studyDay {
  background: #eef4ff;
  border-radius: 12px;
  padding: 13px;
  margin: 12px 0;
}

.question {
  background: #f6f0ff;
  padding: 12px;
  border-radius: 10px;
  margin: 7px 0;
}

.words {
  background: #fff6df;
  padding: 13px;
  border-radius: 10px;
}

.practice {
  background: #e9f7ed;
  padding: 13px;
  border-radius: 10px;
}

.button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.complete {
  background: #315d9b;
  color: white;
}

.voice {
  background: #fff0d5;
  color: #8a5600;
}

.back {
  background: white;
  border: 1px solid #ccc;
}

.small {
  color: #777;
  font-size: 13px;
}

.hidden {
  display: none;
}

@media(max-width:430px) {
  .menu {
    grid-template-columns: 1fr;
  }

  .days {
    grid-template-columns: repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 나의 공부</h1>
  <p>성경 30일 · 영어 명시 50편</p>
</header>

<div class="container">

  <div class="menu">
    <button id="bibleMenu" onclick="showBible()">

    </div>
  </div>

    <div class="days" id="bibleDays"></div>

    <div class="card" id="bibleContent"></div>

  </section>

  <!-- 영어 명시 -->
  <section id="poemSection" class="hidden">

    <div class="days" id="poemDays"></div>

    <div class="card" id="poemContent"></div>

  </section>

</div>

/* =====================================================
   저장
===================================================== */

let bibleDone =
JSON.parse(localStorage.getItem("bibleDone") || "[]");

let poemDone =
JSON.parse(localStorage.getItem("poemDone") || "[]");

let bibleCurrent = 1;
let poemCurrent = 1;


/* =====================================================
   화면 전환
===================================================== */

function showBible(){

  document.getElementById("bibleSection").classList.remove("hidden");
  document.getElementById("poemSection").classList.add("hidden");

  document.getElementById("bibleMenu").classList.add("active");
  document.getElementById("poemMenu").classList.remove("active");

  document.getElementById("progressTitle").textContent =
  "📊 성경 진행률";

  renderBibleDays();
  renderBible();

}


function showPoems(){

  document.getElementById("bibleSection").classList.add("hidden");
  document.getElementById("poemSection").classList.remove("hidden");

  document.getElementById("bibleMenu").classList.remove("active");
  document.getElementById("poemMenu").classList.add("active");

  document.getElementById("progressTitle").textContent =
  "📊 영어 명시 진행률";

  renderPoemDays();
  renderPoem();

}


/* =====================================================
   성경
===================================================== */

function renderBibleDays(){

  const box =
  document.getElementById("bibleDays");

  box.innerHTML="";

  bible.forEach((item,i)=>{

    const button =
    document.createElement("button");

    button.textContent =
    bibleDone.includes(i+1)
    ? "✓"+(i+1)
    : (i+1);

    if(bibleCurrent===i+1)
      button.classList.add("active");

    if(bibleDone.includes(i+1))
      button.classList.add("done");

    button.onclick=()=>{

      bibleCurrent=i+1;

      renderBibleDays();
      renderBible();

    };

    box.appendChild(button);

  });

  updateProgress();

}


function renderBible(){

  const d =
  bible[bibleCurrent-1];

  const questions =
  d[3].map((q,i)=>
  `<div class="question">
  <strong>${i+1}.</strong> ${q}
  </div>`
  ).join("");

  document.getElementById("bibleContent").innerHTML=`

  <h2>📖 ${d[0]}</h2>

  <div class="poemTitle">${d[1]}</div>

  <p>${d[2]}</p>

  <h3>💭 묵상해 볼 질문</h3>

  ${questions}

  <h3>⭐ 오늘의 실천</h3>

  <div class="practice">
  오늘 읽은 내용 가운데 한 가지를 실제 생활에서 실천해 보세요.
  </div>

  <button class="button voice"
  onclick="speak('${d[2]}')">
  🔊 내용 음성으로 듣기
  </button>

  <button class="button complete"
  onclick="toggleBible(${bibleCurrent})">

  ${
    bibleDone.includes(bibleCurrent)
    ? "✅ 완료 취소"
    : "☑️ 오늘 읽기 완료"
  }

  </button>

  `;

}


/* =====================================================
   영어 명시
===================================================== */

function renderPoemDays(){

  const box =
  document.getElementById("poemDays");

  box.innerHTML="";

  for(let day=1;day<=100;day++){

    const button =
    document.createElement("button");

    const poemNumber =
    Math.ceil(day/2);

    button.textContent =
    poemDone.includes(day)
    ? "✓"+day
    : day;

    if(poemCurrent===day)
      button.classList.add("active");

    if(poemDone.includes(day))
      button.classList.add("done");

    button.onclick=()=>{

      poemCurrent=day;

      renderPoemDays();
      renderPoem();

    };

    box.appendChild(button);

  }

  updateProgress();

}


function renderPoem(){

  const poemNumber =
  Math.ceil(poemCurrent/2);

  const p =
  poems[poemNumber-1];

  const firstDay =
  poemNumber*2-1;

  const secondDay =
  poemNumber*2;

  const studyDay =
  poemCurrent===firstDay
  ? "1일차 · 작품 이해"
  : "2일차 · 표현과 생각";

  document.getElementById("poemContent").innerHTML=`

  <div class="studyDay">
  🇬🇧 영어 명시 ${poemNumber}/50<br>
  ${firstDay}–${secondDay}일차<br>
  <strong>${studyDay}</strong>
  </div>

  <div class="poemTitle">
  ${p[1]}
  </div>

  <div class="author">
  ${p[0]}
  </div>

  <h3>📝 작품 소개</h3>

  <p>${p[2]}</p>

  <h3>📜 영어 표현</h3>

  <div class="words">
  <strong>${p[3][0]}</strong>
  <br><br>
  핵심 표현을 소리 내어 읽어 보세요.
  </div>

  <h3>🧠 핵심 공부</h3>

  <div class="words">
  • 작품의 주제를 파악합니다.<br>
  • 모르는 단어를 찾아봅니다.<br>
  • 문장을 소리 내어 읽습니다.<br>
  • 자신의 말로 내용을 설명해 봅니다.
  </div>

  <h3>💭 생각해 볼 질문</h3>

  <div class="question">
  1. ${p[3][1]}
  </div>

  <div class="question">
  2. ${p[3][2]}
  </div>

  <div class="question">
  3. 오늘 이 작품에서 기억하고 싶은 것은 무엇입니까?
  </div>

  <h3>🇰🇷 한국어 풀이</h3>

  <div class="practice">
  이 작품은 <strong>${p[1]}</strong>이라는 주제를 통해
  인간의 감정, 자연, 삶 또는 사회에 대해 생각하게 합니다.
  영어 문장을 먼저 이해한 뒤 자신의 말로 한국어로 설명해 보세요.
  </div>

  <button class="button voice"
  onclick="speakEnglish('${p[3][0]}')">
  🔊 영어로 읽어 듣기
  </button>

  <button class="button complete"
  onclick="togglePoem(${poemCurrent})">

  ${
    poemDone.includes(poemCurrent)
    ? "✅ 이 날의 공부 완료 취소"
    : "☑️ 이 날의 공부 완료"
  }

  </button>

  <p class="small">
  ${firstDay}–${secondDay}일차는 같은 명시를 공부합니다.
  </p>

  `;

}


/* =====================================================
   완료
===================================================== */

function toggleBible(day){

  if(bibleDone.includes(day)){

    bibleDone =
    bibleDone.filter(x=>x!==day);

  }else{

    bibleDone.push(day);

  }

  localStorage.setItem(
  "bibleDone",
  JSON.stringify(bibleDone)
  );

  renderBibleDays();
  renderBible();

}


function togglePoem(day){

  if(poemDone.includes(day)){

    poemDone =
    poemDone.filter(x=>x!==day);

  }else{

    poemDone.push(day);

  }

  localStorage.setItem(
  "poemDone",
  JSON.stringify(poemDone)
  );

  renderPoemDays();
  renderPoem();

}


/* =====================================================
   진행률
===================================================== */

function updateProgress(){

  let done;
  let total;

  if(
    !document
    .getElementById("poemSection")
    .classList.contains("hidden")
  ){

    done=poemDone.length;
    total=100;

  }else{

    done=bibleDone.length;
    total=30;

  }

  const percent =
  Math.round(done/total*100);

  document.getElementById("progressText").textContent =
  `${done} / ${total}일 완료`;

  document.getElementById("progressBar").style.width =
  percent+"%";

}


/* =====================================================
   음성
===================================================== */

function speak(text){

  if(!("speechSynthesis" in window)){

    alert("이 휴대폰의 음성 읽기를 사용할 수 없습니다.");

    return;

  }

  speechSynthesis.cancel();

  const u =
  new SpeechSynthesisUtterance(text);

  u.lang="ko-KR";
  u.rate=.9;

  speechSynthesis.speak(u);

}


function speakEnglish(text){

  if(!("speechSynthesis" in window)){

    alert("이 휴대폰의 음성 읽기를 사용할 수 없습니다.");

    return;

  }

  speechSynthesis.cancel();

  const u =
  new SpeechSynthesisUtterance(text);

  u.lang="en-US";
  u.rate=.8;

  speechSynthesis.speak(u);

}


/* 시작 */

showBible();

</script>
