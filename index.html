<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>매수 수익 계산기</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    .input-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    .buy-btn {
        background: #2563eb;
        color: white;
    }

    .reset-btn {
        background: #6b7280;
        color: white;
    }

    .result {
        margin-top: 20px;
        background: #f9fafb;
        padding: 15px;
        border-radius: 10px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    .row:last-child {
        border-bottom: none;
    }

    .highlight {
        font-size: 20px;
        font-weight: bold;
    }

    .history {
        margin-top: 20px;
    }

    .history-item {
        padding: 10px;
        margin-top: 8px;
        background: #f3f4f6;
        border-radius: 8px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>📈 매수 수익 계산기</h1>

    <div class="input-box">

        <input
            type="number"
            id="buyPrice"
            placeholder="매수가격"
        >

        <input
            type="number"
            id="buyQuantity"
            placeholder="매수 주식수"
        >

    </div>

    <button
        class="buy-btn"
        onclick="addBuy()"
    >
        매수 입력
    </button>

    <button
        class="reset-btn"
        onclick="resetAll()"
    >
        전체 초기화
    </button>


    <div class="result">

        <div class="row">
            <span>총 매수금액</span>
            <strong id="totalAmount">0원</strong>
        </div>

        <div class="row">
            <span>총 보유주식</span>
            <strong id="totalQuantity">0주</strong>
        </div>

        <div class="row">
            <span>평균매수가</span>
            <strong id="averagePrice">0원</strong>
        </div>

        <div class="row">
            <span>+5% 목표매도가</span>
            <strong id="targetPrice">0원</strong>
        </div>

        <div class="row highlight">
            <span>+5% 예상수익금</span>
            <strong id="profit">0원</strong>
        </div>

    </div>


    <div class="history">

        <h3>매수 내역</h3>

        <div id="historyList"></div>

    </div>

</div>


<script>

let totalAmount = 0;
let totalQuantity = 0;
let round = 0;

let history = [];


function addBuy() {

    const price =
        Number(
            document.getElementById("buyPrice").value
        );

    const quantity =
        Number(
            document.getElementById("buyQuantity").value
        );


    if (
        price <= 0 ||
        quantity <= 0
    ) {

        alert(
            "매수가격과 주식수를 입력하세요."
        );

        return;

    }


    round++;


    const amount =
        price * quantity;


    totalAmount += amount;

    totalQuantity += quantity;


    history.push({

        round: round,

        price: price,

        quantity: quantity,

        amount: amount

    });


    updateDisplay();


    document.getElementById(
        "buyPrice"
    ).value = "";

    document.getElementById(
        "buyQuantity"
    ).value = "";

}


function updateDisplay() {


    const averagePrice =
        totalQuantity > 0
        ? totalAmount / totalQuantity
        : 0;


    const targetPrice =
        averagePrice * 1.05;


    const profit =
        (targetPrice * totalQuantity)
        - totalAmount;


    document.getElementById(
        "totalAmount"
    ).innerText =
        formatMoney(totalAmount);


    document.getElementById(
        "totalQuantity"
    ).innerText =
        totalQuantity.toLocaleString()
        + "주";


    document.getElementById(
        "averagePrice"
    ).innerText =
        formatMoney(averagePrice);


    document.getElementById(
        "targetPrice"
    ).innerText =
        formatMoney(targetPrice);


    document.getElementById(
        "profit"
    ).innerText =
        formatMoney(profit);


    updateHistory();

}


function updateHistory() {

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    history.forEach(item => {


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "history-item";


        div.innerHTML = `

            <strong>
                ${item.round}회차
            </strong>

            <br>

            매수가:
            ${formatMoney(item.price)}

            <br>

            수량:
            ${item.quantity.toLocaleString()}주

            <br>

            매수금액:
            ${formatMoney(item.amount)}

        `;


        list.appendChild(div);

    });

}


function resetAll() {

    if (
        !confirm(
            "모든 매수 내역을 초기화할까요?"
        )
    ) {

        return;

    }


    totalAmount = 0;

    totalQuantity = 0;

    round = 0;

    history = [];


    updateDisplay();

}


function formatMoney(value) {

    return Math.round(value)
        .toLocaleString()
        + "원";

}


updateDisplay();

</script>

</body>
</html>
